# Lighttpd vhost for the modern Allsky web interface.
#
# Drop into /etc/lighttpd/conf-available/50-allskyweb.conf and enable with
# `lighty-enable-mod allskyweb`. Adjust server.document-root if you build
# the React bundle to a different path.

server.modules += ( "mod_proxy", "mod_setenv" )

$HTTP["host"] =~ "" {
    server.document-root = "/opt/allsky-web/frontend/dist"

    # WebSocket: live frame stream
    $HTTP["url"] =~ "^/api/live/ws" {
        proxy.server = (
            "" => (( "host" => "127.0.0.1", "port" => 8000 ))
        )
        proxy.header = ( "upgrade" => "enable" )
    }

    # Everything else under /api → uvicorn
    $HTTP["url"] =~ "^/api/" {
        proxy.server = (
            "" => (( "host" => "127.0.0.1", "port" => 8000 ))
        )
    }

    # SPA fallback: any non-API, non-asset URL → index.html
    url.rewrite-if-not-file = (
        "^/(?!api/|assets/|favicon\.ico)(.*)" => "/index.html"
    )
}
